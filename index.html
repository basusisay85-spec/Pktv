<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Trading App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f7fc;
            --header-bg: linear-gradient(135deg, #7b9cff, #8a74f9);
            --text-dark: #1e2329;
            --text-muted: #848e9c;
            --green: #0ecb81;
            --red: #f6465d;
            --white: #ffffff;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); padding-bottom: 80px; overflow-x: hidden; }

        /* Top Header */
        .top-header { 
            background: var(--header-bg); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .balance-pill { 
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 15px; border-radius: 20px; color: white; font-weight: bold; font-size: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .balance-pill i { color: #f1c40f; }
        .header-icons { display: flex; gap: 10px; }
        .icon-btn { 
            width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); 
            display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; cursor: pointer;
        }
        .pro-btn { 
            background: rgba(255,255,255,0.2); border: 1px solid white; color: white; 
            padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;
        }

        /* Banner */
        .banner { background: var(--green); color: black; text-align: center; padding: 10px; font-size: 12px; font-weight: bold; margin-bottom: 15px;}
        
        /* Asset Selector */
        .asset-scroll { display: flex; gap: 15px; overflow-x: auto; padding: 0 20px 15px 20px; scrollbar-width: none; }
        .asset-scroll::-webkit-scrollbar { display: none; }
        .asset-card { 
            flex: 0 0 auto; background: var(--white); border-radius: 15px; padding: 10px 15px; 
            text-align: center; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer;
        }
        .asset-card.active { border-color: #7b9cff; box-shadow: 0 2px 10px rgba(123, 156, 255, 0.3); }
        .asset-icon { width: 40px; height: 40px; border-radius: 10px; margin: 0 auto 8px auto; display: flex; justify-content: center; align-items: center; font-size: 20px;}
        .asset-name { font-size: 12px; font-weight: bold; }
        .asset-price { font-size: 12px; color: var(--text-muted); margin-top: 2px;}

        /* Main Price */
        .main-price-area { padding: 0 20px; margin-bottom: 20px; }
        .main-price { font-size: 32px; font-weight: bold; color: var(--text-dark); display: flex; align-items: baseline; gap: 5px;}
        .main-price span { font-size: 28px; }
        .price-change { color: var(--red); font-size: 14px; font-weight: bold; margin-top: 5px; display: flex; align-items: center; gap: 5px;}

        /* Chart Area */
        .chart-container { padding: 0 20px; margin-bottom: 20px; height: 250px; position: relative;}
        .chart-tools { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px;}
        .tool-btn { background: var(--white); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 12px; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; gap: 5px;}

        /* Bottom Trade Buttons */
        .trade-actions { 
            position: fixed; bottom: 70px; left: 0; width: 100%; 
            display: flex; gap: 15px; padding: 0 20px; z-index: 100;
        }
        .btn-trade { flex: 1; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; border: none; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-sell { background: var(--red); }
        .btn-buy { background: var(--green); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); display: flex; justify-content: space-around; padding: 10px 0 15px 0; border-top: 1px solid var(--border); z-index: 500; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); cursor: pointer; }
        .nav-item.active { color: var(--text-dark); font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        /* Toast */
        #toast { visibility: hidden; min-width: 250px; background-color: var(--text-dark); color: white; text-align: center; border-radius: 10px; padding: 16px; position: fixed; z-index: 3000; left: 50%; bottom: 150px; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-weight: bold; }
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="top-header">
        <div class="balance-pill">
            <i class="fa-solid fa-coins"></i> 10 000.00
        </div>
        <div class="header-icons">
            <div class="icon-btn"><i class="fa-regular fa-folder"></i></div>
            <div class="pro-btn">PRO</div>
        </div>
    </div>

    <!-- Banner -->
    <div class="banner">
        WHY CAN I TRADE ONLY 5 ASSETS? 🔥 READ MORE
    </div>

    <!-- Asset Selector -->
    <div class="asset-scroll">
        <div class="asset-card">
            <div class="asset-icon" style="background: #e3f2fd; color: #1976d2;">🇪🇺</div>
            <div class="asset-name">EUR/USD</div>
            <div class="asset-price">$1.12317</div>
        </div>
        <div class="asset-card">
            <div class="asset-icon" style="background: #fff3e0; color: #f57c00;">₿</div>
            <div class="asset-name">BITCOIN</div>
            <div class="asset-price">$83,572.80</div>
        </div>
        <div class="asset-card">
            <div class="asset-icon" style="background: #f3e5f5; color: #8e24aa;">🇺🇸</div>
            <div class="asset-name">USD/JPY</div>
            <div class="asset-price">157.921</div>
        </div>
        <div class="asset-card">
            <div class="asset-icon" style="background: #eceff1; color: #546e7a;">🛢️</div>
            <div class="asset-name">OIL</div>
            <div class="asset-price">$109.339</div>
        </div>
        <div class="asset-card active">
            <div class="asset-icon" style="background: #e8eaf6; color: #3f51b5;">🇬🇧</div>
            <div class="asset-name">GBP/USD</div>
            <div class="asset-price">$1.33936</div>
        </div>
    </div>

    <!-- Main Price -->
    <div class="main-price-area">
        <div class="main-price">1 GBP = <span id="live-price">$1.33936</span></div>
        <div class="price-change" id="price-change">
            <i class="fa-solid fa-arrow-down"></i> <span id="change-val">-0.004 (0.27%)</span>
        </div>
    </div>

    <!-- Chart Area -->
    <div class="chart-container">
        <div class="chart-tools">
            <div class="tool-btn">15 sec <i class="fa-solid fa-caret-down"></i></div>
            <div class="tool-btn"><i class="fa-solid fa-chart-line"></i></div>
            <div class="tool-btn"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        </div>
        <canvas id="liveChart"></canvas>
    </div>

    <!-- Trade Buttons -->
    <div class="trade-actions">
        <button class="btn-trade btn-sell" onclick="tradeAction('Sell')">
            <i class="fa-solid fa-arrow-down"></i> Sell
        </button>
        <button class="btn-trade btn-buy" onclick="tradeAction('Buy')">
            Buy <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active"><div class="nav-icon"><i class="fa-solid fa-chart-simple"></i></div>Trade</div>
        <div class="nav-item"><div class="nav-icon"><i class="fa-solid fa-graduation-cap"></i></div>Learn</div>
        <div class="nav-item"><div class="nav-icon"><i class="fa-solid fa-magnifying-glass-chart"></i></div>Analyse</div>
        <div class="nav-item"><div class="nav-icon"><i class="fa-solid fa-trophy"></i></div>Top</div>
        <div class="nav-item"><div class="nav-icon"><i class="fa-regular fa-user"></i></div>Profile</div>
    </div>

    <div id="toast">Processing...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Chart.js Setup for Live Moving Chart
        const ctx = document.getElementById('liveChart').getContext('2d');
        
        // መጀመሪያ ላይ የሚታዩ የዳታ ነጥቦች
        let chartLabels = ['14:21', '14:22', '14:23', '14:24', '14:25', '14:26', '14:27', '14:28', '14:29', '14:30'];
        let chartData = [1.3390, 1.3392, 1.3391, 1.3393, 1.3395, 1.3394, 1.3396, 1.3393, 1.3392, 1.33936];

        const liveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: 'GBP/USD',
                    data: chartData,
                    borderColor: '#2b7cff', // ሰማያዊ መስመር
                    backgroundColor: 'rgba(43, 124, 255, 0.1)', // የታችኛው ሰማያዊ ጥላ
                    borderWidth: 2,
                    fill: true,
                    tension: 0.1, // የመስመሩ አቀማመጥ
                    pointRadius: 0,
                    pointHoverRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 500, // በየሰከንዱ ለስላሳ እንቅስቃሴ
                    easing: 'linear'
                },
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false }, // የጎን ቁጥሮች እንዳይታዩ
                    y: { 
                        position: 'right',
                        grid: { color: '#f0f0f0' },
                        ticks: { color: '#848e9c', font: {size: 10} }
                    }
                }
            }
        });

        // 2. Live Price Simulation (ዋጋው በየሰከንዱ እንዲንቀሳቀስ ማድረግ)
        let currentPrice = 1.33936;

        setInterval(() => {
            // በዘፈቀደ ትንሽ ቁጥር መጨመር ወይም መቀነስ (-0.0005 እስከ +0.0005)
            const change = (Math.random() - 0.5) * 0.001; 
            currentPrice += change;
            
            // የዋጋ ማሳያውን ማዘመን
            document.getElementById('live-price').innerText = '$' + currentPrice.toFixed(5);
            
            // ቀለሙን መቀየር (ካመለጠ አረንጓዴ፣ ከወረደ ቀይ)
            const changeDiv = document.getElementById('price-change');
            if(change > 0) {
                changeDiv.style.color = 'var(--green)';
                changeDiv.innerHTML = `<i class="fa-solid fa-arrow-up"></i> +${change.toFixed(4)} (0.27%)`;
            } else {
                changeDiv.style.color = 'var(--red)';
                changeDiv.innerHTML = `<i class="fa-solid fa-arrow-down"></i> ${change.toFixed(4)} (0.27%)`;
            }

            // የግራፉን ዳታ ማዘመን (አዲሱን ዋጋ መጨመር እና የመጀመሪያውን ማጥፋት)
            liveChart.data.datasets[0].data.shift(); // የመጀመሪያውን ነጥብ አጥፋ
            liveChart.data.datasets[0].data.push(currentPrice); // አዲሱን ጨምር
            liveChart.update(); // ግራፉን አዘምን

        }, 1500); // በየ 1.5 ሰከንድ ይንቀሳቀሳል

        // 3. Trade Action Logic
        window.tradeAction = function(type) {
            if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                return showToast("Please open inside Telegram!");
            }

            const user = tg.initDataUnsafe.user;
            
            // መልእክት ወደ አድሚን መላክ
            fetch('/api/complete_task', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    task_name: `${type} GBP/USD`, 
                    user_id: user.id, 
                    username: user.username || user.first_name,
                    details: `Price: $${currentPrice.toFixed(5)} | Action: ${type}`
                })
            }).then(res => res.json()).then(data => { 
                if(data.status === "success") {
                    showToast(`✅ ${type} Order Sent to Admin!`);
                }
            }).catch(err => showToast("❌ Error connecting to server"));
        };

        window.showToast = function(msg) {
            const toast = document.getElementById("toast"); 
            toast.innerText = msg; 
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        };
    </script>
</body>
</html>
